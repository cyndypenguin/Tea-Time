<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Teahouse 2.0</title>
<style>
:root{
  color-scheme: dark;
  --bg:#070A08; --ink:#F4ECDC; --ink-soft:#BDB39D; --paper:#121812; --line:#2A3226; --on:#D9BE8A; --on-ink:#1B140A;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#161B17; --ink:#EFE8D8; --ink-soft:#BAB3A0; --paper:#252E27; --line:#46513F; --on:#E3A59D; --on-ink:#1B241D;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#161B17; --ink:#EFE8D8; --ink-soft:#BAB3A0; --paper:#252E27; --line:#46513F; --on:#E3A59D; --on-ink:#1B241D;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;align-items:center;padding:14px 16px 8px}
.grp{display:inline-flex;align-items:center;gap:6px}
.grp .lab{font-size:.8rem;color:var(--ink-soft);margin-right:2px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button,.reload{font:inherit;font-size:.85rem;border:0;background:none;color:var(--ink-soft);padding:6px 13px;border-radius:999px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-ink);font-weight:700}
.reload{border:1px solid var(--line);background:var(--paper);color:var(--ink)}
:focus-visible{outline:2px solid #B48D4B;outline-offset:2px}

.stage{flex:1;width:100%;display:flex;justify-content:center;align-items:flex-start;padding:6px 0 16px;min-height:0}
.holder{position:relative}
.phone{position:absolute;left:50%;top:0;transform-origin:top center;background:#14161A;border-radius:56px;padding:12px;box-shadow:0 30px 60px -28px rgba(0,0,0,.6),inset 0 0 0 2px #2B2E34}
.screen{position:relative;border-radius:44px;overflow:hidden;background:#fff}
.status{display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;height:47px;font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.status .ic{display:flex;gap:5px;align-items:center}
.status svg{height:11px;width:auto;fill:currentColor}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#000;border-radius:20px;z-index:3}
iframe{display:block;width:100%;border:0;background:transparent}
.home{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:9px;background:#14161A;opacity:.55;z-index:3;pointer-events:none}
.note{flex:none;margin:0;font-size:.78rem;color:var(--ink-soft);text-align:center;padding:0 16px 10px;max-width:46em}

/* Full width view (for the website layout) */
body.full .stage{padding:0 16px 16px;align-items:stretch}
body.full .holder{width:100%!important;height:auto!important;display:flex}
body.full .phone{position:static;transform:none!important;width:100%!important;margin:0!important;flex:1;padding:0;border-radius:16px;background:none;box-shadow:0 20px 40px -26px rgba(0,0,0,.5);border:1px solid var(--line);overflow:hidden}
body.full .screen{width:100%!important;height:100%!important;border-radius:0}
body.full .status,body.full .island,body.full .home{display:none}
body.full iframe{height:100%!important}

/* On a real phone the app simply fills the screen, with no frame */
@media (max-width:600px) and (pointer:coarse){
  .bar,.note{display:none}
  .stage{position:fixed;inset:0;padding:0;align-items:stretch}
  .holder{width:100%!important;height:100%!important}
  .phone{position:static;transform:none!important;width:100%!important;margin:0!important;height:100%;padding:0;border-radius:0;background:none;box-shadow:none}
  .screen{width:100%!important;height:100%!important;border-radius:0}
  .status,.island,.home{display:none}
  iframe{height:100%!important}
}
</style>
</head>
<body>
<div class="bar">
  <div class="grp" role="group" aria-label="Screen size"><span class="lab">Size</span>
    <div class="seg" id="devs"></div></div>
  <div id="themes" hidden></div>
  <button type="button" class="reload" id="reload">Restart</button>
</div>

<div class="stage"><div class="holder" id="holder">
  <div class="phone" id="phone">
    <div class="screen" id="screen">
      <div class="island"></div>
      <div class="status" id="status"><span id="clock">9:41</span>
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx=".7"/><rect x="5" y="5" width="3" height="6" rx=".7"/><rect x="10" y="2.5" width="3" height="8.5" rx=".7"/><rect x="15" y="0" width="3" height="11" rx=".7"/></svg>
          <svg viewBox="0 0 16 12"><path d="M8 2.4c2.3 0 4.4.9 6 2.4l1.1-1.2C13.2 1.8 10.7.8 8 .8S2.800 1.800.900 3.600L2 4.800c1.600-1.500 3.700-2.400 6-2.400z"/><path d="M8 5.700c1.400 0 2.700.5 3.700 1.400l1.100-1.200C11.500 4.700 9.800 4.100 8 4.100S4.500 4.700 3.200 5.900l1.100 1.200c1-.9 2.300-1.400 3.700-1.400z"/><path d="M8 9c.6 0 1.200.2 1.600.6L8 11.300 6.400 9.600C6.800 9.200 7.400 9 8 9z"/></svg>
          <svg viewBox="0 0 27 12" style="height:12px"><rect x=".5" y=".5" width="22" height="11" rx="3.2" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="19" height="8" rx="2"/><rect x="24" y="4" width="2" height="4" rx="1" opacity=".5"/></svg>
        </span></div>
      <iframe id="app" title="Little Teahouse running at phone size"></iframe>
      <div class="home"></div>
    </div>
  </div>
</div></div>
<p class="note">Little Teahouse 2.0 at phone size. Choose Full for the wide layout.</p>

<script>
const APP = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Little Teahouse — tea timer and tea guide<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@200;300;400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<meta name=\"theme-color\" content=\"#0A0E0B\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<style>\n:root{\n  color-scheme:dark;\n  --bg:#0A0E0B; --ink:#F4ECDC; --ink-soft:#BDB39D; --ink-mute:#8B826F;\n  --gold:#D9BE8A; --gold-hi:#EBD6A6; --gold-lo:#A98A5C; --rose:#D79A8E;\n  --line:rgba(232,208,160,.15); --line-hi:rgba(232,208,160,.36);\n  --glass:rgba(255,246,226,.05); --glass-hi:rgba(255,246,226,.09);\n  --btn:linear-gradient(135deg,#F0D8A8 0%,#D2AA6C 55%,#BC9358 100%); --btn-ink:#1B140A;\n  --serif:\"Cormorant Garamond\",\"Iowan Old Style\",\"Palatino Linotype\",Georgia,serif;\n  --sans:\"Manrope\",\"SF Pro Text\",\"Segoe UI\",system-ui,sans-serif;\n  --tab-h:66px; --tab-gap:10px;\n  box-sizing:border-box;\n}\n*,*::before,*::after{box-sizing:inherit}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;font-weight:400;letter-spacing:.004em;-webkit-font-smoothing:antialiased;position:relative}\nbody::before{content:\"\";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 520px at 50% -6%,rgba(217,190,138,.13),transparent 62%),radial-gradient(560px 460px at 100% 46%,rgba(150,100,60,.10),transparent 62%),radial-gradient(520px 420px at 0% 80%,rgba(60,90,60,.12),transparent 62%)}\nsvg{max-width:100%}\nbutton{font:inherit;color:inherit;cursor:pointer}\n:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:12px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n[hidden]{display:none!important}\n.bough,.flourish{display:none}\n\n.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:18px 16px calc(var(--tab-h) + var(--tab-gap) + 56px + env(safe-area-inset-bottom,0px))}\n\n/* top bar */\n.top{display:flex;justify-content:flex-end}\n.toggle{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:3px}\n.toggle button{border:0;background:none;padding:5px 13px;border-radius:999px;font-size:.78rem;font-weight:600;letter-spacing:.06em;color:var(--ink-mute);min-height:32px}\n.toggle button[aria-pressed=\"true\"]{background:rgba(217,190,138,.16);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(217,190,138,.4)}\n\n.hero{text-align:center;padding:10px 0 4px}\n.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.7rem,9vw,4rem);letter-spacing:.03em;line-height:1.02;margin:4px 0 6px;background:linear-gradient(180deg,#FBEFD3 0%,#D9BE8A 62%,#B8955E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}\n.hero p{margin:0 auto;max-width:28em;color:var(--ink-soft);font-size:.9rem;letter-spacing:.02em}\n\n.controls{margin:22px 0 14px;display:flex;flex-direction:column;gap:12px;align-items:center}\n.search{position:relative;width:min(460px,100%)}\n.search input{width:100%;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:999px;padding:13px 18px 13px 46px;font:inherit;font-size:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}\n.search input::placeholder{color:var(--ink-mute)}\n.search input:focus{outline:none;border-color:var(--line-hi);box-shadow:0 0 0 3px rgba(217,190,138,.12)}\n.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gold)}\n.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}\n.chip{border:1px solid var(--line);background:var(--glass);padding:6px 16px;border-radius:999px;font-size:.84rem;font-weight:500;letter-spacing:.03em;color:var(--ink-soft);min-height:38px;transition:background .3s,color .3s,border-color .3s}\n.chip[aria-pressed=\"true\"]{background:rgba(217,190,138,.16);border-color:var(--gold);color:var(--gold-hi);font-weight:700}\n.countrow{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}\n.count{color:var(--ink-mute);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;margin:0}\n\n/* tea cards */\n.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}\n.card{position:relative;border-radius:26px;background:linear-gradient(180deg,rgba(255,246,226,.075),rgba(255,246,226,.025));border:1px solid var(--line);overflow:hidden;box-shadow:0 24px 44px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,246,226,.06);transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .3s}\n.card::before{content:\"\";position:absolute;inset:0;background:radial-gradient(75% 44% at 50% 27%,rgba(217,190,138,.15),transparent 78%);pointer-events:none}\n.card:hover{transform:translateY(-3px);border-color:var(--line-hi)}\n.card-main{position:relative;display:block;width:100%;border:0;background:none;text-align:center;padding:6px 10px 16px;border-radius:inherit}\n.thumb{display:block;width:100%;aspect-ratio:1;object-fit:contain;margin:0 auto -8px;transform:scale(1.14);filter:drop-shadow(0 16px 14px rgba(0,0,0,.35))}\n.card h3{font-family:var(--serif);font-weight:600;font-size:1.32rem;letter-spacing:.01em;line-height:1.15;margin:0;color:var(--ink)}\n.card .native{display:block;color:var(--ink-mute);font-size:.74rem;margin-top:2px}\n.card .origin{display:block;color:var(--ink-soft);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;margin:7px 0 10px;line-height:1.4}\n.pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}\n.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;color:var(--gold-hi);border:1px solid var(--line);background:rgba(217,190,138,.07);padding:3px 10px;border-radius:999px;letter-spacing:.02em}\n.pill svg{width:12px;height:12px}\n.liquor{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--liq);box-shadow:0 0 0 1.5px rgba(255,246,226,.35);vertical-align:0;margin-right:3px}\n.fav{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(10,14,11,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;color:var(--gold-hi)}\n.fav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}\n.fav[aria-pressed=\"true\"]{color:var(--rose);border-color:rgba(215,154,142,.5)}\n.fav[aria-pressed=\"true\"] svg{fill:currentColor}\n.card.add{background:transparent;border:1px dashed var(--line-hi);box-shadow:none}\n.card.add::before{display:none}\n.card.add .card-main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px 14px;color:var(--gold-hi)}\n.card.add h3{font-size:1.15rem}\n.card.add p{margin:0;font-size:.76rem;color:var(--ink-mute);max-width:14em}\n.plus{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;border:1px solid var(--line-hi);background:rgba(217,190,138,.08);color:var(--gold-hi)}\n.plus svg{width:20px;height:20px}\n.empty{text-align:center;color:var(--ink-soft);padding:40px 0;grid-column:1/-1}\n.empty h3{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0 0 4px;color:var(--ink)}\n.empty p{margin:0 0 16px}\n.eico{width:54px;height:54px;display:block;margin:0 auto 10px;fill:none;stroke:var(--gold);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}\n\n/* sheets */\n.scrim{position:fixed;inset:0;background:rgba(4,6,5,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;opacity:0;transition:opacity .4s ease}\n.scrim.show{opacity:1}\n.sheet{position:fixed;left:50%;bottom:0;width:min(720px,100%);max-height:calc(100% - 22px - env(safe-area-inset-top,0px));transform:translate(-50%,104%);transition:transform .55s cubic-bezier(.2,.85,.25,1);z-index:21;background:linear-gradient(180deg,#18211A 0%,#0D120E 70%);border:1px solid var(--line);border-bottom:0;border-radius:32px 32px 0 0;overflow-y:auto;overscroll-behavior:contain;padding:0 0 calc(30px + env(safe-area-inset-bottom,0px));box-shadow:0 -30px 60px -20px rgba(0,0,0,.7)}\n.sheet.show{transform:translate(-50%,0)}\n.grab{position:relative;width:42px;height:4px;border-radius:9px;background:var(--line-hi);margin:10px auto 0;touch-action:none}\n.grab::after{content:\"\";position:absolute;inset:-14px -60px}\n.sheet-head{display:flex;align-items:center;gap:14px;padding:18px 20px 4px;touch-action:pan-x}\n.sheet-head .frame{display:none}\n.sheet-head h2{font-family:var(--serif);font-weight:600;font-size:2.1rem;line-height:1.05;letter-spacing:.01em;margin:0;color:var(--ink)}\n.sheet-head .sub{color:var(--ink-mute);font-size:.8rem;margin-top:3px}\n.headbtns{margin-left:auto;align-self:flex-start;display:flex;gap:8px;flex:none}\n.close,.edit{height:42px;border-radius:999px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;color:var(--gold-hi)}\n.close{width:42px}\n.edit{padding:0 16px;font-size:.84rem;font-weight:700;letter-spacing:.04em}\n.close svg{width:15px;height:15px}\n\n.facts{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:8px;margin:12px 16px 0}\n.fact{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center}\n.fact b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:600;line-height:1.25;color:var(--ink)}\n.fact span{font-size:.62rem;letter-spacing:.14em;text-transform /header>\n\n  <section class=\"hub\" id=\"pTimer\" hidden aria-label=\"Timer\">\n    <div id=\"hubActive\" hidden>\n      <button type=\"button\" class=\"hubback\" id=\"hubBack\" hidden>‹ Timer home<\/button>\n      <div class=\"hubhead\"><div><h3 id=\"hubName\"><\/h3><p id=\"hubSub\"><\/p><\/div><button type=\"button\" class=\"edit\" id=\"hubGuide\">Brew guide<\/button><\/div>\n      <button type=\"button\" class=\"btn ghost hubchange\" id=\"hubChange\" hidden>Choose a different tea<\/button>\n    <\/div>\n    <div id=\"hubEmpty\" class=\"hubempty\">\n      <div class=\"emptyhero\"><div class=\"heroslot\" id=\"emptySlot\"><\/div><\/div>\n      <h3>What are we brewing?<\/h3>\n      <p>Pick a tea and the water and timer are set for you.<\/p>\n      <div class=\"qbtitle\">Quick brew<\/div>\n      <div class=\"qbgrid\" id=\"qbGrid\"><\/div>\n      <button type=\"button\" class=\"addbtn\" id=\"hubBrowse\">Browse all teas<\/button>\n    <\/div>\n  <\/section>\n  <section class=\"grid\" id=\"grid\" aria-label=\"Teas\"><\/section>\n<\/main>\n\n<nav class=\"tabbar\" id=\"tabbar\" aria-label=\"Main\">\n  <button type=\"button\" class=\"tabitem\" data-tab=\"teas\" aria-current=\"page\"><span class=\"ico\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#i-tab-leaf\"/><\/svg><\/span><span class=\"tlab\">Teas<\/span><\/button>\n  <button type=\"button\" class=\"tabitem\" data-tab=\"timer\"><span class=\"ico\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#i-tab-timer\"/><\/svg><i class=\"dot\"><\/i><\/span><span class=\"tlab\">Timer<\/span><\/button>\n  <button type=\"button\" class=\"tabitem\" data-tab=\"saved\"><span class=\"ico\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#i-tab-heart\"/><\/svg><\/span><span class=\"tlab\">Saved<\/span><\/button>\n  <button type=\"button\" class=\"tabitem\" data-tab=\"mine\"><span class=\"ico\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#i-tab-pot\"/><\/svg><\/span><span class=\"tlab\">My teas<\/span><\/button>\n<\/nav>\n\n<button type=\"button\" class=\"mini\" id=\"mini\" aria-label=\"Open running timer\" tabindex=\"-1\">\n  <svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"16\" fill=\"none\" stroke=\"var(--sage-wash)\" stroke-width=\"4\"/><circle id=\"miniRing\" cx=\"20\" cy=\"20\" r=\"16\" fill=\"none\" stroke=\"var(--gold)\" stroke-width=\"4\" stroke-linecap=\"round\" transform=\"rotate(-90 20 20)\" stroke-dasharray=\"100.53\" stroke-dashoffset=\"100.53\"/><\/svg>\n  <span id=\"miniName\"><\/span><b id=\"miniTime\">0:00<\/b>\n<\/button>\n\n<div class=\"scrim\" id=\"scrim\" hidden><\/div>\n\n<!-- Tea sheet -->\n<section class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\" hidden>\n  <div class=\"grab\" aria-hidden=\"true\"><\/div>\n  <div class=\"sheet-head\">\n    <div>\n      <h2 id=\"sheetTitle\"><\/h2>\n      <div class=\"sub\" id=\"sheetSub\"><\/div>\n    <\/div>\n    <div class=\"headbtns\">\n      <button type=\"button\" class=\"edit\" id=\"editBtn\" hidden>Edit<\/button>\n      <button type=\"button\" class=\"close\" id=\"close\" aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"facts\" id=\"facts\"><\/div>\n\n  <div class=\"timer\" id=\"timer\">\n    <div class=\"dialwrap\" id=\"dialwrap\">\n      <svg class=\"dial\" id=\"dial\" viewBox=\"0 0 300 300\" role=\"img\" aria-label=\"Brewing progress\">\n        <circle class=\"ring-track\" cx=\"150\" cy=\"150\" r=\"124\"/>\n        <circle class=\"ring\" id=\"ring\" cx=\"150\" cy=\"150\" r=\"124\"/>\n        <circle id=\"bead\" cx=\"150\" cy=\"26\" r=\"4.5\"/>\n      <\/svg>\n      <div class=\"heroslot\" id=\"heroSlot\"><\/div>\n    <\/div>\n    <div class=\"digits\" id=\"digits\">0:00<\/div>\n    <div class=\"status\" id=\"status\" aria-live=\"polite\"><\/div>\n    <div class=\"steeps\" id=\"steeps\" role=\"group\" aria-label=\"Choose a steep\"><\/div>\n    <div class=\"btns\">\n      <button type=\"button\" class=\"btn ghost\" id=\"reset\">Reset<\/button>\n      <button type=\"button\" class=\"btn\" id=\"primary\">Start<\/button>\n    <\/div>\n    <p class=\"note\" id=\"note\" hidden><\/p>\n  <\/div>\n\n  <div class=\"tabs\" role=\"tablist\" aria-label=\"About this tea\">\n    <button class=\"tab\" role=\"tab\" id=\"tab-brew\" aria-controls=\"panel\" aria-selected=\"true\" data-tab=\"brew\">Brew guide<\/button>\n    <button class=\"tab\" role=\"tab\" id=\"tab-enjoy\" aria-controls=\"panel\" aria-selected=\"false\" data-tab=\"enjoy\" tabindex=\"-1\">Enjoy and pair<\/button>\n    <button class=\"tab\" role=\"tab\" id=\"tab-story\" aria-controls=\"panel\" aria-selected=\"false\" data-tab=\"story\" tabindex=\"-1\">Story<\/button>\n  <\/div>\n  <div class=\"panel\" id=\"panel\" role=\"tabpanel\"><\/div>\n\n  <div class=\"dock\" id=\"dock\" aria-hidden=\"true\">\n    <svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"16\" fill=\"none\" stroke=\"var(--sage-wash)\" stroke-width=\"4\"/><circle id=\"dockRing\" cx=\"20\" cy=\"20\" r=\"16\" fill=\"none\" stroke=\"var(--gold)\" stroke-width=\"4\" stroke-linecap=\"round\" transform=\"rotate(-90 20 20)\" stroke-dasharray=\"100.53\" stroke-dashoffset=\"100.53\"/><\/svg>\n    <span class=\"dock-text\"><span id=\"dockLabel\"><\/span><b id=\"dockTime\">0:00<\/b><\/span>\n    <button type=\"button\" class=\"btn\" id=\"dockBtn\" tabindex=\"-1\">Start<\/button>\n  <\/div>\n<\/section>\n\n<!-- Add / edit tea sheet -->\n<section class=\"sheet\" id=\"formSheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"formTitle\" hidden>\n  <div class=\"grab\" aria-hidden=\"true\"><\/div>\n  <div class=\"sheet-head\">\n    <svg class=\"frame\" viewBox=\"0 0 100 100\" aria-hidden=\"true\"><use href=\"#quatre\"/><use id=\"formArt\" href=\"#m-green\" x=\"6\" y=\"6\" width=\"88\" height=\"88\" clip-path=\"url(#qclip)\"/><\/svg>\n    <div>\n      <h2 id=\"formTitle\">Add your own tea<\/h2>\n      <div class=\"sub\" id=\"formSub\">Set it up once and the timer remembers it.<\/div>\n    <\/div>\n    <div class=\"headbtns\"><button type=\"button\" class=\"close\" id=\"formClose\" aria-label=\"Close\"><svg><use href=\"#i-x\"/><\/svg><\/button><\/div>\n  <\/div>\n  <form class=\"form\" id=\"teaForm\" novalidate>\n    <label class=\"field\"><span class=\"lab\">Name<\/span><input id=\"fName\" maxlength=\"40\" autocomplete=\"off\" placeholder=\"Grandma’s jasmine\"><\/label>\n    <fieldset class=\"field\"><legend class=\"lab\">Type<\/legend><div class=\"typepick\" id=\"fType\" role=\"radiogroup\" aria-label=\"Type\"><\/div><\/fieldset>\n    <label class=\"field\"><span class=\"lab\">Water temperature (<span id=\"fUnit\">°C<\/span>)<\/span><input id=\"fTemp\" type=\"number\" inputmode=\"numeric\"><\/label>\n    <div class=\"field\"><span class=\"lab\" id=\"steepsLab\">Steep times<\/span><div id=\"fSteeps\" role=\"group\" aria-labelledby=\"steepsLab\"><\/div><button type=\"button\" class=\"link\" id=\"fAddSteep\">+ Add another steep<\/button><\/div>\n    <label class=\"field\"><span class=\"lab\">Leaf amount <em>(optional)<\/em><\/span><input id=\"fLeaf\" maxlength=\"60\" autocomplete=\"off\" placeholder=\"1 tsp per 250 ml\"><\/label>\n    <label class=\"field\"><span class=\"lab\">Notes <em>(optional)<\/em><\/span><textarea id=\"fNotes\" rows=\"3\" maxlength=\"600\" placeholder=\"Where it’s from, how you like it, what you pair it with\"><\/textarea><\/label>\n    <p class=\"form-error\" id=\"fErr\" role=\"alert\"><\/p>\n    <div class=\"btns\">\n      <button type=\"button\" class=\"btn ghost\" id=\"fDelete\" hidden>Delete<\/button>\n      <button type=\"submit\" class=\"btn\" id=\"fSave\">Save tea<\/button>\n    <\/div>\n    <p class=\"savednote\" id=\"savedNote\">Your teas are saved to this browser.<\/p>\n  <\/form>\n<\/section>\n\n<script>\n/* ================= Tea data ================= */\nconst LEAF = {\n  green:\"1 tsp (2–3 g) per 250 ml\", black:\"1 tsp (2–3 g) per 250 ml\", white:\"2 tbsp (3 g) per 250 ml\",\n  oolong:\"1 tbsp (3–4 g) per 250 ml\", puerh:\"4 g per 250 ml\", herbal:\"1 tbsp (2 g) per 250 ml\", blend:\"1 tsp (2–3 g) per 250 ml\"\n};\nconst CATS = [\n  {id:\"all\",label:\"All teas\"},{id:\"green\",label:\"Green\"},{id:\"black\",label:\"Black\"},{id:\"white\",label:\"White\"},\n  {id:\"oolong\",label:\"Oolong\"},{id:\"puerh\",label:\"Pu-erh\"},{id:\"herbal\",label:\"Herbal\"},{id:\"blend\",label:\"Blends\"}\n];\nconst TYPES = [\"green\",\"black\",\"white\",\"oolong\",\"puerh\",\"herbal\",\"blend\"];\nconst CAT_LABEL = {green:\"Green tea\",black:\"Black tea\",white:\"White tea\",oolong:\"Oolong\",puerh:\"Pu-erh\",herbal:\"Herbal\",blend:\"Blend\"};\nconst TYPE_SHORT = {green:\"Green\",black:\"Black\",white:\"White\",oolong:\"Oolong\",puerh:\"Pu-erh\",herbal:\"Herbal\",blend:\"Blend\"};\nconst CAT_DEFAULT = {green:{t:80,s:120},black:{t:100,s:240},white:{t:85,s:240},oolong:{t:95,s:150},puerh:{t:100,s:150},herbal:{t:100,s:300},blend:{t:95,s:240}};\nconst CAT_LIQ = {green:\"#C3C870\",black:\"#9A4520\",white:\"#E3D49A\",oolong:\"#D2B060\",puerh:\"#5A2814\",herbal:\"#D9A64A\",blend:\"#A8582A\"};\nconst CAT_CAFF = {green:\"Medium\",black:\"High\",white:\"Low\",oolong:\"Medium\",puerh:\"Medium\",herbal:\"None\",blend:\"Varies\"};\n\nconst TEAS = [\n {id:\"sencha\",name:\"Sencha\",native:\"煎茶\",cat:\"green\",origin:\"Shizuoka, Japan\",temp:75,steeps:[60,30,60],caffeine:\"Medium\",liquor:\"#B9C46A\",\n  flavor:\"Grassy, bright and gently sweet with a savory finish.\",\n  tips:[\"Keep the water well below boiling — hotter water turns sencha bitter.\",\"Pour out every last drop so the next steep stays fresh.\"],\n  enjoy:\"Drink it plain, never with milk. The second steep is often sweeter than the first.\",\n  pair:[\"Onigiri\",\"Sashimi\",\"Mochi\",\"Cucumber salad\"],\n  story:\"Sencha is Japan’s everyday tea. In 1738 Nagatani Sōen of Uji refined the method of steaming and rolling fresh leaves, which keeps them vivid green. Today most of the tea grown in Japan becomes sencha.\"},\n {id:\"gyokuro\",name:\"Gyokuro\",native:\"玉露\",cat:\"green\",origin:\"Uji and Yame, Japan\",temp:60,steeps:[120,60,90],caffeine:\"High\",liquor:\"#C8D47C\",leaf:\"2 tsp (5 g) per 150 ml\",\n  flavor:\"Deep umami, like a sweet sea-breeze broth.\",\n  tips:[\"Use more leaf and less water than usual; a small pot brings out the umami.\",\"Let boiled water cool for several minutes before pouring.\"],\n  enjoy:\"Sip slowly from a small cup, almost like a broth. After the last steep, the soft leaves can be eaten with a little ponzu.\",\n  pair:[\"Wagashi\",\"Sea bream sashimi\",\"Chawanmushi\"],\n  story:\"Gyokuro means “jade dew.” The bushes are shaded for about three weeks before harvest, which raises amino acids like L-theanine and softens bitterness. The style took shape in Uji in the 1830s and is still among Japan’s most prized teas.\"},\n {id:\"matcha\",name:\"Matcha\",native:\"抹茶\",cat:\"green\",origin:\"Uji and Nishio, Japan\",temp:80,steeps:[30],caffeine:\"High\",liquor:\"#7FA34A\",leaf:\"2 g (1 tsp) per 70 ml\",action:\"Whisk\",\n  flavor:\"Velvety, vegetal and sweet with a gentle bitterness.\",\n  steps:[\"Sift 2 g (about 1 tsp) of matcha into a warmed bowl.\",\"Add 70 ml of water heated to the temperature above.\",\"Whisk briskly in a W motion until a fine foam forms — the timer counts it for you.\",\"Drink right away, before the powder settles.\"],\n  enjoy:\"Drink it in a few sips straight from the bowl. For a latte, whisk with a splash of water first, then top with steamed milk.\",\n  pair:[\"Wagashi\",\"White chocolate\",\"Strawberries\",\"Butter cookies\"],\n  story:\"The monk Eisai brought powdered tea from China to Japan in 1191. Zen temples embraced it, and by the 1500s tea master Sen no Rikyū had shaped it into chanoyu, the tea ceremony built on harmony, respect, purity and tranquility.\"},\n {id:\"longjing\",name:\"Dragon Well\",native:\"龙井\",cat:\"green\",origin:\"Hangzhou, China\",temp:80,steeps:[120,150,180],caffeine:\"Medium\",liquor:\"#D3CC7A\",\n  flavor:\"Toasty chestnut, soft and smooth.\",\n  tips:[\"Brew in a clear glass to watch the flat leaves stand up and drift down.\",\"The leaves give three good steeps; add a little time each round.\"],\n  enjoy:\"Drink plain and notice the toasted chestnut sweetness as it cools.\",\n  pair:[\"Shrimp with tea leaves\",\"Steamed fish\",\"Almond cookies\"],\n  story:\"Dragon Well comes from the hills around West Lake in Hangzhou. Its flat jade leaves are pan-fired by hand in hot woks. Legend says the Qianlong Emperor named eighteen bushes imperial tea trees, and they are still tended today.\"},\n {id:\"genmaicha\",name:\"Genmaicha\",native:\"玄米茶\",cat:\"green\",origin:\"Japan\",temp:85,steeps:[120,90],caffeine:\"Low\",liquor:\"#D6C27A\",\n  flavor:\"Nutty and savory, like toasted rice and popcorn.\",\n  tips:[\"A little hotter than most greens is fine — the toasted rice loves it.\",\"Some popped rice may float; that’s normal.\"],\n  enjoy:\"Comforting with meals or on a cold afternoon. Its popcorn aroma makes it a favorite with first-time tea drinkers.\",\n  pair:[\"Ramen\",\"Tempura\",\"Rice crackers\",\"Teriyaki\"],\n  story:\"Genmaicha blends green tea with toasted brown rice. It’s often called “people’s tea” because the rice once stretched precious leaves further. Today it’s loved simply for its cozy, savory taste.\"},\n {id:\"hojicha\",name:\"Hojicha\",native:\"ほうじ茶\",cat:\"green\",origin:\"Kyoto, Japan\",temp:90,steeps:[60,45],caffeine:\"Low\",liquor:\"#A9663A\",\n  flavor:\"Toasty caramel and cocoa with no bitterness.\",\n  tips:[\"Roasting removed the bitterness, so it’s forgiving with hot water.\",\"Try it as a latte with warm milk and a little honey.\"],\n  enjoy:\"Mellow and low in caffeine — a favorite evening tea in Japan and lovely after a heavy meal.\",\n  pair:[\"Dark chocolate\",\"Roasted sweet potato\",\"Custard pudding\",\"Grilled fish\"],\n  story:\"Hojicha was first roasted in Kyoto in the 1920s, when tea merchants began roasting leftover leaves and stems over charcoal. Roasting turns the leaves reddish brown and gives a warm, toasty aroma.\"},\n {id:\"jasmine\",name:\"Jasmine Pearls\",native:\"茉莉龙珠\",cat:\"green\",origin:\"Fujian, China\",temp:80,steeps:[150,180,240],caffeine:\"Medium\",liquor:\"#E3D58E\",\n  flavor:\"Floral and honeyed with a clean, sweet finish.\",\n  tips:[\"Watch the hand-rolled pearls slowly unfurl.\",\"Avoid boiling water, or the floral scent turns flat.\"],\n  enjoy:\"Enjoy it plain to savor the fragrance. It’s the classic tea at dim sum.\",\n  pair:[\"Dim sum\",\"Peaches\",\"Shortbread\",\"Light seafood\"],\n  story:\"Fuzhou in Fujian is the heart of jasmine tea. Tea is layered with fresh jasmine buds that open at night, and their scent soaks into the leaves; the finest grades repeat this many times. Jasmine has been China’s best-loved scented tea since the Qing dynasty.\"},\n\n {id:\"gunpowder\",name:\"Gunpowder\",native:\"珠茶\",cat:\"green\",origin:\"Zhejiang, China\",temp:80,steeps:[60,90,120],caffeine:\"Medium\",liquor:\"#B9B65E\",\n  flavor:\"Smoky, vegetal and bright, with a clean, slightly brisk finish.\",\n  tips:[\"Give the tight pellets a short rinse to wake them up.\",\"Use a generous pinch, since the rolled leaves need room to open.\"],\n  enjoy:\"Strong enough to take a little sugar or fresh mint, just as in Moroccan mint tea.\",\n  pair:[\"Moroccan pastries\",\"Grilled chicken\",\"Mint sweets\",\"Salted nuts\"],\n  story:\"Gunpowder is named for its tightly rolled pellets, which look like grains of gunpowder. Each leaf is rolled by hand in Zhejiang. Its sturdy pellets travel well, which helped make it a popular export, especially to Morocco.\"},\n\n {id:\"kukicha\",name:\"Kukicha\",native:\"茎茶\",cat:\"green\",origin:\"Japan\",temp:80,steeps:[60,60],caffeine:\"Low\",liquor:\"#D1BE7A\",\n  flavor:\"Sweet, nutty and gently roasted, with very little bitterness.\",\n  tips:[\"Stems are light, so use a little more than you would for sencha.\",\"It cold-brews beautifully: steep overnight in the fridge for a mellow glass.\"],\n  enjoy:\"A calm, low-caffeine cup at any time of day. It's especially good after a meal.\",\n  pair:[\"Sushi\",\"Tempura\",\"Steamed rice\",\"Japanese pickles\"],\n  story:\"Kukicha, or twig tea, is made from the stems and stalks that are removed while sencha and gyokuro are processed. Those twigs were once seen as a by-product. Roasting and blending them gives a sweet, mellow tea that is now treasured in Japan.\"},\n {id:\"assam\",name:\"Assam\",native:\"অসম\",cat:\"black\",origin:\"Assam, India\",temp:100,steeps:[240],caffeine:\"High\",liquor:\"#8A3E1B\",\n  flavor:\"Bold, malty and brisk.\",\n  tips:[\"Use freshly boiled water to draw out the full malty body.\",\"It’s strong — perfect with a splash of milk.\"],\n  enjoy:\"A bold morning cup. Add milk and a little sugar, or use it as the base for homemade chai.\",\n  pair:[\"Buttered toast\",\"Scones\",\"Bacon and eggs\",\"Gingerbread\"],\n  story:\"Assam grows in the lowland Brahmaputra Valley of northeast India. In 1823 Robert Bruce learned of the native tea plant from the Singpho people, and Assam became India’s first tea region. Its malty strength is the backbone of most breakfast blends.\"},\n {id:\"darjeeling\",name:\"Darjeeling\",native:\"दार्जिलिंग\",cat:\"black\",origin:\"West Bengal, India\",temp:90,steeps:[180,240],caffeine:\"High\",liquor:\"#C27A34\",\n  flavor:\"Light and floral with muscatel grape notes.\",\n  tips:[\"Use water just off the boil; spring first flush likes it a touch cooler.\",\"Taste before adding milk — lighter flushes are best plain.\"],\n  enjoy:\"Drink it plain to catch the muscatel notes. Autumn and second-flush teas can take a little milk.\",\n  pair:[\"Cucumber sandwiches\",\"Fruit tart\",\"Mild cheese\",\"Lemon cake\"],\n  story:\"Grown on Himalayan slopes, Darjeeling is called “the Champagne of teas.” Each harvest, or flush, has its own character. In 2004 it became India’s first product with a protected geographical indication.\"},\n {id:\"nilgiri\",name:\"Nilgiri\",native:\"நீலகிரி\",cat:\"black\",origin:\"Nilgiri Hills, India\",temp:95,steeps:[180,240],caffeine:\"High\",liquor:\"#B5612A\",\n  flavor:\"Bright, floral and smooth, with a gentle citrus note.\",\n  tips:[\"Use freshly boiled water.\",\"A shorter steep keeps it light; go longer for a fuller, brisker cup.\"],\n  enjoy:\"Lovely plain or with a splash of milk. An easy, everyday black tea.\",\n  pair:[\"Scones\",\"Lemon biscuits\",\"Fruit cake\",\"Mild cheddar\"],\n  story:\"The Nilgiri Hills in southern India rise high enough to grow tea with a cool, gentle character. Tea was first planted there in the 19th century, and the region is known for smooth black tea that is often used in blends.\"},\n {id:\"ceylon\",name:\"Ceylon\",native:\"ලංකා තේ\",cat:\"black\",origin:\"Sri Lanka\",temp:100,steeps:[240],caffeine:\"High\",liquor:\"#B0501F\",\n  flavor:\"Bright and brisk with a citrusy edge.\",\n  tips:[\"Fully boiled water brings out its bright, lively character.\",\"Brew it a little stronger for iced tea and pour over ice.\"],\n  enjoy:\"Lively hot or iced, with lemon or milk. A great all-day tea.\",\n  pair:[\"Lemon drizzle cake\",\"Fried chicken\",\"Curry\",\"Shortbread\"],\n  story:\"Sri Lanka grew coffee until a leaf blight destroyed the crop in the 1870s. James Taylor had planted tea at Loolecondera in 1867, and tea soon covered the hills. The island’s old name, Ceylon, still names its tea.\"},\n {id:\"keemun\",name:\"Keemun\",native:\"祁门红茶\",cat:\"black\",origin:\"Anhui, China\",temp:95,steeps:[180,240],caffeine:\"High\",liquor:\"#8E3A22\",\n  flavor:\"Winey and smooth with orchid, cocoa and a whisper of smoke.\",\n  tips:[\"Just under a full boil keeps its floral side.\",\"A second steep brings out cocoa notes.\"],\n  enjoy:\"Elegant on its own, and it takes milk well too.\",\n  pair:[\"Dark chocolate\",\"Roast duck\",\"Plum cake\",\"Aged cheddar\"],\n  story:\"Keemun comes from Qimen County in Anhui. It was created in 1875 when Yu Ganchen began making black tea in the Fujian style. It quickly became a favorite in Britain and was part of early English Breakfast blends.\"},\n {id:\"lapsang\",name:\"Lapsang Souchong\",native:\"正山小种\",cat:\"black\",origin:\"Wuyi Mountains, China\",temp:95,steeps:[180,240],caffeine:\"High\",liquor:\"#6E2E18\",\n  flavor:\"Pine smoke, dried fruit and a sweet, resinous finish.\",\n  tips:[\"Start with a shorter steep — the smoke builds quickly.\",\"Mix a pinch into another black tea for a gentle smoky blend.\"],\n  enjoy:\"A campfire in a cup. Lovely on a cold day, plain or with a little milk.\",\n  pair:[\"Smoked salmon\",\"Aged gouda\",\"Barbecue\",\"Dark chocolate\"],\n  story:\"Lapsang Souchong from the Wuyi Mountains is often called the world’s first black tea. The leaves are dried over pinewood fires. A local legend says it began when passing soldiers delayed the drying and farmers hurried it over fire.\"},\n {id:\"yunnan\",name:\"Yunnan Gold\",native:\"滇红\",cat:\"black\",origin:\"Yunnan, China\",temp:95,steeps:[180,240],caffeine:\"High\",liquor:\"#A0521F\",\n  flavor:\"Honeyed and smooth with a peppery finish.\",\n  tips:[\"Look for golden tips — they bring honeyed sweetness.\",\"Smooth and forgiving; a longer steep rarely turns bitter.\"],\n  enjoy:\"Wonderful plain, with or without milk.\",\n  pair:[\"Honey cake\",\"Spiced nuts\",\"Roast pork\",\"Apple pie\"],\n  story:\"Dian Hong, Yunnan black tea, was first made in 1939 in Fengqing, Yunnan. It uses the same large-leaf tea plants as pu-erh. The finest grades are covered in soft golden buds.\"},\n\n {id:\"honey-black\",name:\"Honey Black\",native:\"Smoky honey black tea\",sub:\"Smoky honey black tea from Wuyishan, Fujian, China\",cat:\"black\",origin:\"Wuyishan, Fujian, China\",temp:100,tempRange:[93,100],steeps:[180,210,240,270],caffeine:\"High\",liquor:\"#B8742A\",leaf:\"1 tbsp (3 g) per 300 ml\",\n  flavor:\"Smoky, honey-sweet and malty, with a hint of roasted yam and a mellow finish.\",\n  tips:[\"Use freshly boiled water, anywhere from 93 to 100°C.\",\"Steep for 3 minutes, or to taste, then strain so it doesn’t over-brew.\",\"For a cold brew, use the same amount of leaf in cold water and refrigerate for 4 to 6 hours.\"],\n  enjoy:\"Lovely plain, or with a little honey on a cold day. The same leaves can be steeped again, up to three more times.\",\n  pair:[\"Roasted sweet potato\",\"Dark chocolate\",\"Gingerbread\",\"Walnut cake\"],\n  story:\"Wuyishan, in northern Fujian, is known as the birthplace of black tea. The story goes that villagers burned Masson pine to keep their tea dry through the damp seasons, and the drifting smoke, with just the right amount of fermentation, drew out a natural sweetness like honey and roasted yam. The practice has continued ever since.\"},\n {id:\"silver-needle\",name:\"Silver Needle\",native:\"白毫银针\",cat:\"white\",origin:\"Fujian, China\",temp:80,steeps:[240,300,360],caffeine:\"Low\",liquor:\"#EADFA8\",\n  flavor:\"Delicate honey, melon and soft hay.\",\n  tips:[\"Be patient: a longer steep at a lower temperature.\",\"The buds can be steeped three or more times.\"],\n  enjoy:\"Sip slowly, plain, from a small cup.\",\n  pair:[\"Pear slices\",\"Melon\",\"Almond cookies\",\"Fresh cheese\"],\n  story:\"Silver Needle uses only downy buds picked in early spring in Fuding and Zhenghe. The buds are simply withered and dried — the least processed of all teas. Their silvery fuzz gives the tea its name.\"},\n {id:\"white-peony\",name:\"White Peony\",native:\"白牡丹\",cat:\"white\",origin:\"Fujian, China\",temp:85,steeps:[240,300],caffeine:\"Low\",liquor:\"#DDC27C\",\n  flavor:\"Soft florals with hay and honey.\",\n  tips:[\"It handles slightly hotter water than Silver Needle.\",\"Try cold-brewing overnight in the fridge for a sweet summer drink.\"],\n  enjoy:\"Gentle and floral — lovely plain, hot or cold.\",\n  pair:[\"Strawberries\",\"Goat cheese\",\"Vanilla sponge\",\"Grilled vegetables\"],\n  story:\"Bai Mu Dan, “White Peony,” is made from a bud and its first two leaves. It’s fuller than Silver Needle but still gentle. Aged white tea cakes are treasured in Fujian, where people say they improve every year.\"},\n\n {id:\"shou-mei\",name:\"Shou Mei\",native:\"寿眉\",cat:\"white\",origin:\"Fujian, China\",temp:90,steeps:[240,300],caffeine:\"Low\",liquor:\"#D9BE7A\",\n  flavor:\"Mellow, earthy and sweet, with a hint of dried fruit.\",\n  tips:[\"Use a little more leaf than you would for Silver Needle, since the leaves are larger.\",\"Let it steep patiently; the flavor rounds out with time.\"],\n  enjoy:\"Warming and comforting, plain or with a little sugar. It's a favorite everyday white tea.\",\n  pair:[\"Steamed buns\",\"Egg tarts\",\"Sweet pastries\",\"Fresh fruit\"],\n  story:\"Shou Mei, meaning “longevity eyebrow,” is made from larger, older leaves. Its fuller body makes it an everyday favorite in Fujian, and it is often pressed into white tea cakes that become more prized as they age.\"},\n {id:\"tieguanyin\",name:\"Tieguanyin\",native:\"铁观音\",cat:\"oolong\",origin:\"Anxi, Fujian, China\",temp:95,steeps:[120,150,180,240],caffeine:\"Medium\",liquor:\"#D7C163\",\n  flavor:\"Creamy, orchid-floral and buttery.\",\n  tips:[\"Rinse the rolled leaves with hot water for a few seconds first.\",\"Each steep unfurls the leaves more — add time each round.\"],\n  enjoy:\"Best plain, in small cups, over several steeps.\",\n  pair:[\"Steamed dumplings\",\"Lychee\",\"Mooncake\",\"Light stir-fries\"],\n  story:\"Tieguanyin, the “Iron Goddess of Mercy,” comes from Anxi in Fujian. Legend says a poor farmer named Wei cared for a crumbling temple of Guanyin and was led in a dream to the tea bush. It’s one of China’s most famous oolongs.\"},\n {id:\"dong-ding\",name:\"Dong Ding\",native:\"冻顶乌龙\",cat:\"oolong\",origin:\"Nantou, Taiwan\",temp:95,steeps:[60,75,90,120],caffeine:\"Medium\",liquor:\"#C48A3E\",\n  flavor:\"Toasty, roasted and creamy, with honey and a light floral lift.\",\n  tips:[\"Rinse the leaves with hot water, then pour it away quickly.\",\"Keep the first steeps short and add a little time with each round.\"],\n  enjoy:\"Sip from a small cup over several steeps. Its roasted sweetness deepens as the leaves open.\",\n  pair:[\"Pineapple cake\",\"Roasted nuts\",\"Steamed buns\",\"Sesame candy\"],\n  story:\"Dong Ding, or “Frozen Summit,” takes its name from a mist-covered mountain in Lugu, Nantou County, Taiwan. Its traditional roast gives a deeper flavor, and it is one of Taiwan’s most famous oolongs.\"},\n {id:\"da-hong-pao\",name:\"Da Hong Pao\",native:\"大红袍\",cat:\"oolong\",origin:\"Wuyi Mountains, China\",temp:100,steeps:[90,120,150,180],caffeine:\"Medium\",liquor:\"#9A4E22\",\n  flavor:\"Roasted, mineral and stony-sweet with a long finish.\",\n  tips:[\"Use fully boiled water to wake up the roasted character.\",\"It rewards many short steeps in a small pot.\"],\n  enjoy:\"Sip slowly; the aftertaste lingers.\",\n  pair:[\"Roast duck\",\"Braised pork\",\"Dark chocolate\",\"Toasted nuts\"],\n  story:\"Da Hong Pao, “Big Red Robe,” grows on the rocky cliffs of the Wuyi Mountains. Legend tells of an emperor who draped red robes over the bushes to thank them for healing his mother. The original mother trees are now protected and no longer harvested.\"},\n {id:\"milk-oolong\",name:\"Milk Oolong\",native:\"金萱\",cat:\"oolong\",origin:\"Taiwan\",temp:90,steeps:[120,150,180],caffeine:\"Medium\",liquor:\"#DCC572\",\n  flavor:\"Buttery, creamy and lightly floral.\",\n  tips:[\"Slightly cooled water shows off the creaminess.\",\"Natural Jin Xuan is creamy on its own; some versions are scented, so check the label.\"],\n  enjoy:\"Smooth and friendly — a great first oolong. Best plain.\",\n  pair:[\"Shortbread\",\"Pineapple cake\",\"Peaches\",\"Mild curry\"],\n  story:\"Milk oolong comes from Jin Xuan, a tea plant bred in Taiwan and released in 1981. It naturally gives a buttery, milky texture with no milk added, and it thrives in Taiwan’s high mountains.\"},\n {id:\"oriental-beauty\",name:\"Oriental Beauty\",native:\"东方美人\",cat:\"oolong\",origin:\"Hsinchu, Taiwan\",temp:85,steeps:[150,180,240],caffeine:\"Medium\",liquor:\"#C1772E\",\n  flavor:\"Honey, ripe peach and muscat.\",\n  tips:[\"Keep the water just below boiling so the honey notes stay sweet.\",\"The curly leaves are delicate — handle them gently.\"],\n  enjoy:\"Naturally sweet; no sugar needed.\",\n  pair:[\"Apricot tart\",\"Honey cake\",\"Ripe figs\",\"Brie\"],\n  story:\"Oriental Beauty comes from Hsinchu in northern Taiwan. Tiny leafhoppers nibble the leaves in summer, and the plant’s response creates its honey and fruit flavors. A popular tale says Queen Victoria named it, though that’s likely just a legend.\"},\n\n {id:\"osmanthus-oolong\",name:\"Osmanthus Oolong\",native:\"Oolong with osmanthus blossoms\",sub:\"Oolong scented with osmanthus blossoms, from Anxi, Fujian, China\",cat:\"oolong\",origin:\"Anxi, Fujian, China\",temp:93,steeps:[60,75,90],caffeine:\"Medium\",liquor:\"#E3CC72\",leaf:\"1 tbsp per 300 ml\",\n  flavor:\"Citrus and apricot over a smooth, mellow oolong, with a soft floral fragrance.\",\n  tips:[\"Keep the first steep short: 1 minute in 93°C water.\",\"Add about 15 seconds to each re-steep as the leaves unfold.\",\"For a cold brew, use 1 tbsp per 350 ml of cold water and refrigerate for about 5 hours.\"],\n  enjoy:\"Sip it hot, or cold-brewed over ice for a juicy, refreshing chilled cup.\",\n  pair:[\"Sweet rice cakes\",\"Almond cookies\",\"Mooncake\",\"Apricot tart\"],\n  story:\"Osmanthus blossoms are tied to autumn memories: Mid-Autumn nights, sweet rice cakes, and streets scented after rain. Once called the “soul fragrance of the East,” the flower was enjoyed in tea by poets and nobles of the Song dynasty. This blend layers roasted oolong from Anxi with real osmanthus blossoms and rests them together until the fragrance settles into the leaves.\"},\n {id:\"shou\",name:\"Ripe Pu-erh\",native:\"熟普洱\",cat:\"puerh\",origin:\"Yunnan, China\",temp:100,steeps:[120,150,180,240],caffeine:\"Medium\",liquor:\"#4A1E10\",\n  flavor:\"Earthy, smooth and dark, like forest floor and cocoa.\",\n  tips:[\"Rinse the leaves with boiling water for 10 seconds and pour it away.\",\"It rarely turns bitter, so it’s very forgiving.\"],\n  enjoy:\"Smooth and warming. A classic with rich meals in Hong Kong and southern China.\",\n  pair:[\"Dim sum\",\"Roast pork\",\"Dark chocolate\",\"Mushroom dishes\"],\n  story:\"Ripe pu-erh is made with wo dui, a careful fermentation of piled leaves developed at the Kunming Tea Factory in 1973. It recreates the depth of long-aged tea in months instead of decades. It’s often pressed into round cakes.\"},\n {id:\"sheng\",name:\"Raw Pu-erh\",native:\"生普洱\",cat:\"puerh\",origin:\"Yunnan, China\",temp:95,steeps:[90,120,150,180],caffeine:\"Medium\",liquor:\"#C9A33F\",\n  flavor:\"Young: bright, floral, bittersweet. Aged: mellow, deep and woody.\",\n  tips:[\"Rinse briefly before the first steep.\",\"Young raw pu-erh can be bold; shorten the steep if it’s too bitter.\"],\n  enjoy:\"Sip plain over many steeps and notice how it changes.\",\n  pair:[\"Salted nuts\",\"Dried apricots\",\"Fatty fish\",\"Aged cheese\"],\n  story:\"Raw pu-erh comes from Yunnan’s large-leaf tea trees, some hundreds of years old. Horse caravans once carried it along the Tea Horse Road to Tibet. Pressed cakes keep changing as they age, much like fine wine.\"},\n\n {id:\"tulsi\",name:\"Tulsi\",native:\"तुलसी\",cat:\"herbal\",origin:\"India\",temp:100,steeps:[300],caffeine:\"None\",liquor:\"#7A9A4A\",\n  flavor:\"Peppery and clove-like, with a fresh, sweet mint finish.\",\n  tips:[\"Cover the cup while it steeps to keep the aromatic oils in.\",\"A squeeze of lemon or a little honey brightens the spice.\"],\n  enjoy:\"A soothing cup after a long day. It's also refreshing served iced with lemon.\",\n  pair:[\"Honey\",\"Lemon cake\",\"Fresh fruit\",\"Ginger biscuits\"],\n  story:\"Tulsi, or holy basil, is sacred in Hinduism and is grown in courtyards and temples across India. Many families keep a tulsi plant at home, and its leaves have long been used in teas and traditional remedies.\"},\n\n {id:\"lemon-verbena\",name:\"Lemon Verbena\",native:\"Aloysia citrodora\",cat:\"herbal\",origin:\"South America\",temp:100,steeps:[300],caffeine:\"None\",liquor:\"#C9C35A\",\n  flavor:\"Bright, sweet lemon with a clean, floral finish.\",\n  tips:[\"Use fresh or dried leaves; the scent fades quickly once opened.\",\"Steep longer for a stronger lemon flavor.\"],\n  enjoy:\"Lovely hot after dinner, or iced with fresh mint. It's naturally caffeine-free.\",\n  pair:[\"Lemon tart\",\"Shortbread\",\"Fresh berries\",\"Honey yogurt\"],\n  story:\"Lemon verbena is native to South America. Plant collectors carried it to Europe in the 1700s, where it became a favorite in home gardens and kitchens. Its leaves have been used for lemony teas and desserts ever since.\"},\n {id:\"chamomile\",name:\"Chamomile\",native:\"Matricaria\",cat:\"herbal\",origin:\"Egypt and Europe\",temp:100,steeps:[300],caffeine:\"None\",liquor:\"#E8C755\",\n  flavor:\"Soft apple and honey.\",\n  tips:[\"Cover the cup while it steeps to keep the aroma in.\",\"Steep longer for a fuller, honeyed cup.\"],\n  enjoy:\"A calm bedtime cup. Add honey and a slice of lemon.\",\n  pair:[\"Honey biscuits\",\"Lemon cake\",\"Apple slices\",\"Oatmeal\"],\n  story:\"Chamomile flowers were brewed in ancient Egypt, Greece and Rome, and it’s now one of the world’s most popular herbal teas. In Beatrix Potter’s tale, Peter Rabbit’s mother gives him a cup after his adventure.\"},\n {id:\"peppermint\",name:\"Peppermint\",native:\"Mentha × piperita\",cat:\"herbal\",origin:\"Europe\",temp:100,steeps:[300],caffeine:\"None\",liquor:\"#C9C27A\",\n  flavor:\"Cool, sweet and refreshing.\",\n  tips:[\"Cover while steeping to keep the cooling oils in the cup.\",\"A longer steep makes it stronger without turning bitter.\"],\n  enjoy:\"Refreshing after meals, hot or iced.\",\n  pair:[\"Dark chocolate\",\"Lamb dishes\",\"Fruit salad\",\"Brownies\"],\n  story:\"Peppermint is a natural hybrid of watermint and spearmint. It was grown widely in England from the 1700s, especially around Mitcham. It has long been a favorite after-dinner drink across Europe and the Middle East.\"},\n {id:\"rooibos\",name:\"Rooibos\",native:\"Red bush\",cat:\"herbal\",origin:\"Cederberg, South Africa\",temp:100,steeps:[360],caffeine:\"None\",liquor:\"#B5481F\",\n  flavor:\"Naturally sweet, nutty, with vanilla and honey.\",\n  tips:[\"Boiling water and a long steep are best — it never turns bitter.\",\"It loves milk and honey, like a caffeine-free breakfast tea.\"],\n  enjoy:\"Try it as a “red latte” with steamed milk.\",\n  pair:[\"Carrot cake\",\"Banana bread\",\"Spiced cookies\",\"Granola\"],\n  story:\"Rooibos, Afrikaans for “red bush,” grows only in South Africa’s Cederberg region. The Khoisan people harvested it long before it became a commercial tea. Its name is now protected in the EU, much like Champagne.\"},\n {id:\"hibiscus\",name:\"Hibiscus\",native:\"Roselle\",cat:\"herbal\",origin:\"Africa, Mexico, Caribbean\",temp:100,steeps:[300],caffeine:\"None\",liquor:\"#A8193A\",\n  flavor:\"Tart and fruity, like cranberry.\",\n  tips:[\"A long, hot steep draws out the deep ruby color.\",\"For iced tea, steep strong, sweeten while warm, then pour over ice.\"],\n  enjoy:\"Delicious iced with honey or lime.\",\n  pair:[\"Tacos\",\"Spiced rice\",\"Dark chocolate\",\"Mango\"],\n  story:\"Hibiscus is loved worldwide: agua de jamaica in Mexico, karkadé in Egypt, and sorrel at Christmas in the Caribbean. It’s made from the dried calyces of the roselle flower.\"},\n {id:\"butterfly-pea\",name:\"Butterfly Pea\",native:\"อัญชัน\",cat:\"herbal\",origin:\"Thailand\",temp:95,steeps:[300],caffeine:\"None\",liquor:\"#3E4FB0\",\n  flavor:\"Mild, earthy and soft.\",\n  tips:[\"Watch it turn deep blue as it steeps.\",\"Squeeze in lemon at the table — it changes from blue to violet.\"],\n  enjoy:\"The magic is the color change. Add honey and lemon, or serve iced.\",\n  pair:[\"Coconut desserts\",\"Sticky rice\",\"Lemon tart\",\"Light salads\"],\n  story:\"Butterfly pea flower is used across Southeast Asia, especially in Thailand, where the tea is called nam dok anchan. It also tints rice and desserts blue. Its pigments react to acid, which is why lemon turns it purple.\"},\n\n {id:\"dragonfruit-ginger\",name:\"Dragonfruit Ginger\",native:\"Caffeine-free fruit and ginger blend\",sub:\"Caffeine-free fruit and ginger blend, with ginger from Yunnan, China\",cat:\"herbal\",origin:\"Ginger from Yunnan, China\",temp:100,steeps:[300],caffeine:\"None\",liquor:\"#C23B5A\",leaf:\"1 sachet per 300 ml\",\n  flavor:\"Tropical and bright with lemon peel, then a gentle, warming ginger spice. Made with dragon fruit, orange, shredded ginger, pungent litse fruit, jujube and goji berries.\",\n  tips:[\"Use fully boiled water (100°C) and steep for 5 minutes.\",\"For a cold brew, use 1 sachet per 300 ml of cold water and refrigerate for about 5 hours.\"],\n  enjoy:\"A cozy cup after dinner, or cold-brewed over ice with a little honey. The soft dried fruit can be eaten once it’s brewed.\",\n  pair:[\"Citrus cake\",\"Coconut desserts\",\"Spiced nuts\",\"Fresh fruit\"],\n  story:\"A Chinese saying goes, “Eat radish in winter, ginger in summer.” Ginger warms and supports digestion, but its heat needs balance. An old tale says dragon fruit was a gift from the Dragon King to calm the summer fire, so the makers paired the two. The blend steeps to a sunset red: spicy, soft and quietly grounding. The ginger is grown on an organic farm in Yunnan.\"},\n {id:\"earl-grey\",name:\"Earl Grey\",native:\"Bergamot black tea\",cat:\"blend\",origin:\"England\",temp:95,steeps:[180],caffeine:\"High\",liquor:\"#9C4A1E\",\n  flavor:\"Citrusy bergamot over brisk black tea.\",\n  tips:[\"Avoid very long steeps; bergamot can turn soapy.\",\"Try a London Fog: Earl Grey, steamed milk and a little vanilla.\"],\n  enjoy:\"Plain, with lemon, or with milk.\",\n  pair:[\"Lemon cake\",\"Scones with jam\",\"Lavender shortbread\",\"Chocolate\"],\n  story:\"Earl Grey is black tea scented with oil of bergamot, a Mediterranean citrus. It’s named after Charles Grey, 2nd Earl Grey and British Prime Minister in the 1830s, though how the blend got his name is still debated.\"},\n {id:\"english-breakfast\",name:\"English Breakfast\",native:\"Assam, Ceylon and Kenyan blend\",cat:\"blend\",origin:\"Britain\",temp:100,steeps:[240],caffeine:\"High\",liquor:\"#8C3A18\",\n  flavor:\"Full-bodied, brisk and comforting.\",\n  tips:[\"Use freshly boiled water and a full steep for a strong cup.\",\"Add milk after pouring so you can judge the strength.\"],\n  enjoy:\"Classic with milk and a little sugar.\",\n  pair:[\"Full breakfast\",\"Toast and marmalade\",\"Crumpets\",\"Scones\"],\n  story:\"English Breakfast blends strong teas such as Assam, Ceylon and Kenyan. Tea merchants in Edinburgh and London both claim to have invented it in the 1800s. It became Britain’s go-to morning cup.\"},\n {id:\"kahwa\",name:\"Kashmiri Kahwa\",native:\"Kashmiri kahwa\",cat:\"blend\",origin:\"Kashmir, India\",temp:95,tempLabel:\"Simmer\",steeps:[300],caffeine:\"Low\",liquor:\"#D6A45A\",action:\"Simmer\",leaf:\"1 tsp green tea per 2 cups\",\n  flavor:\"Fragrant green tea with saffron, cardamom and cinnamon, topped with crushed almonds.\",\n  steps:[\"In a saucepan, bring 500 ml of water to a simmer with a cinnamon stick, a few cardamom pods and a pinch of saffron.\",\"Add 1 tsp of green tea and let it simmer gently while the timer runs.\",\"Sweeten with honey or sugar to taste, then strain into cups.\",\"Garnish each cup with crushed almonds.\"],\n  tips:[\"Saffron is potent, so a few threads are plenty.\",\"Keep it at a gentle simmer so the green tea stays fresh rather than bitter.\"],\n  enjoy:\"Served warm, e
