et(-.38,.2,.6);g.add(dr);},\n  bergamot(g,R){const b=new THREE.Mesh(new THREE.SphereGeometry(.26,28,20),stdMat(0xd7d768,.55));b.position.set(-.3,.3,-.45);g.add(b);const s=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.035,32),stdMat(0xf1e7a8,.5));s.position.set(.3,.15,-.5);s.rotation.set(.9,0,.3);g.add(s);},\n  osmanthus(g,R){for(let i=0;i<16;i++){const f=new THREE.Group(),cx=(R()-.5)*.85,cz=(R()-.5)*.85;for(let k=0;k<4;k++){const p=new THREE.Mesh(new THREE.SphereGeometry(.03,8,6),stdMat(0xf2b84b,.5));const a=k*1.5708;p.position.set(Math.cos(a)*.035,0,Math.sin(a)*.035);f.add(p);}const c=new THREE.Mesh(new THREE.SphereGeometry(.02,8,6),stdMat(0xd9822b,.5));f.add(c);f.position.set(cx,.28+R()*.25,cz);g.add(f);}},\n  jasmine(g,R){for(let i=0;i<5;i++){const f=petalFlower(5,.14,.06,0xfffcf4,.03,0xf2d36b,R,.5);f.position.set((R()-.5)*.7,.3+R()*.2,(R()-.5)*.7);f.rotation.set((R()-.5)*.8,R()*6,(R()-.5)*.8);g.add(f);}},\n  peony(g,R){const f=new THREE.Group();[[7,.3,.2,0xf3d9d0,.9],[6,.24,.16,0xe8b9ae,.9]].forEach(([n,l,w,h,lift],i)=>{const r=petalFlower(n,l,w,h,0,0,R,lift);r.position.y=.04*i;r.rotation.y=i*.5;r.scale.setScalar(1);f.add(r);});f.position.set(.05,.2,.05);g.add(f);}\n};\nfunction makeProps(cfg,R){\n  let g;\n  switch(cfg.k){\n    case'flat':g=flatPile(cfg,R);break;case'twist':g=twistPile(cfg,R);break;case'pearl':g=pearlPile(cfg,R);break;\n    case'needle':g=needlePile(cfg,R);break;case'cake':g=cakeDisc(cfg,R);break;case'powder':g=powderMound(cfg,R);break;\n    case'flower':g=flowerPile(cfg,R);break;case'spice':g=spicePile(cfg,R);break;case'fruit':g=fruitPile(cfg,R);break;\n    default:g=flatPile(WELCOME_ART,R);\n  }\n  (cfg.x||[]).forEach(n=>EXTRAS[n]&&EXTRAS[n](g,R));\n  return g;\n}\n\n/* ---------- one tea, fully assembled ---------- */\nfunction buildTea(key){\n  const cfg=artCfg(key),R=rng(seedOf(key)),g=new THREE.Group();\n  const liq=artLiq(key)||'#C9A55A',V=makeVessel(cfg.v||'cup',liq);\n  const vs=cfg.v==='glass'?.95:cfg.v==='bowl'?.86:cfg.v==='kulhad'?1.0:.82;\n  V.group.position.set(-.55,0,-.1);V.group.scale.setScalar(vs);g.add(V.group);\n  const dish=makeDish();dish.position.set(1.72,0,1.0);dish.scale.setScalar(1.1);g.add(dish);\n  const props=makeProps(cfg,R);props.position.set(1.72,.06,1.0);props.scale.setScalar(1.45);g.add(props);\n  g.add(blobShadow(cfg.v==='cup'?1.75:1.25,.5,-.55,-.1));g.add(blobShadow(1.15,.5,1.72,1.0));\n  /* centre the whole still life so it turns around its own middle */\n  const box=new THREE.Box3();g.traverse(o=>{if(o.isMesh&&!o.userData.blob)box.expandByObject(o);});\n  const c=box.getCenter(new THREE.Vector3());g.position.set(-c.x,0,-c.z);\n  const outer=new THREE.Group();outer.add(g);\n  return{group:outer,liquid:V.liquid,steam:new THREE.Vector3(-.55-c.x,V.top*vs+.1,-.1-c.z),liq,cy:Math.max(.05,c.y*.9-.45)};\n}\nfunction disposeTea(t){\n  t.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.map&&m.map!==_blobTex)m.map.dispose();m.dispose();});}});\n}\n\n/* ---------- snapshots for the cards ---------- */\nconst PIX='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';\nconst thumbSrc=key=>G3.thumbs[key]||PIX;\nconst thumb=(t,cls)=>{const k=artId(t);return `<img class=\"${cls||'thumb'}\" data-thumb=\"${k}\" src=\"${thumbSrc(k)}\" alt=\"\" decoding=\"async\" draggable=\"false\">`;};\nfunction setThumb(key,url){\n  G3.thumbs[key]=url;\n  document.querySelectorAll('img[data-thumb=\"'+key+'\"]').forEach(i=>{i.src=url;});\n}\nfunction fallbackThumb(key){\n  const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d');\n  const l=artLiq(key)||'#C9A55A',g=x.createRadialGradient(100,90,6,120,120,100);g.addColorStop(0,'#fff3d8');g.addColorStop(.35,l);g.addColorStop(1,'#1b140a');\n  x.fillStyle=g;x.beginPath();x.arc(120,128,78,0,6.283);x.fill();\n  x.strokeStyle='rgba(217,190,138,.8)';x.lineWidth=3;x.stroke();\n  return c.toDataURL('image/png');\n}\nfunction nextThumb(){\n  const key=G3.queue.shift();if(!key){return;}\n  try{\n    const st=G3.thumbStage,t=buildTea(key);\n    t.group.rotation.y=-.42;st.scene.add(t.group);frameStage(st,t.cy);G3.thumbR.render(st.scene,st.cam);\n    setThumb(key,G3.thumbR.domElement.toDataURL('image/webp',.92));\n    st.scene.remove(t.group);disposeTea(t);\n  }catch(e){setThumb(key,fallbackThumb(key));}\n  setTimeout(nextThumb,0);\n}\nfunction webglOK(){try{const c=document.createElement('canvas');return !!(window.THREE&&(c.getContext('webgl2')||c.getContext('webgl')));}catch(e){return false;}}\nfunction boot3D(only){\n  const keys=only||[...TEAS.map(t=>t.id),...TYPES.map(c=>'type-'+c)];\n  if(!webglOK()){keys.forEach(k=>setThumb(k,fallbackThumb(k)));return;}\n  try{\n    const r=makeRenderer({preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(420,420,false);\n    G3.thumbR=r;G3.thumbStage=makeStage(r);G3.ok=true;\n    G3.queue=keys.slice();setTimeout(nextThumb,30);\n  }catch(e){G3.ok=false;keys.forEach(k=>setThumb(k,fallbackThumb(k)));}\n}\n\n/* ---------- the live hero in the timer ---------- */\nconst HERO_SLOTS={sheet:'#heroSlot',hub:'#h-heroSlot',empty:'#emptySlot'};\nconst WATER_LIN=col(0xe9dcc0);\nfunction heroSprite(){\n  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,32);\n  g.addColorStop(0,'rgba(255,244,222,.9)');g.addColorStop(1,'rgba(255,244,222,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);\n}\nfunction heroInit(){\n  const r=makeRenderer({});r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));\n  const st=makeStage(r),tex=heroSprite(),sprites=[];\n  for(let i=0;i<14;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0,depthWrite:false}));s.userData={t:i/14,x:(Math.random()-.5)*.5,sp:.35+Math.random()*.25};s.visible=false;st.scene.add(s);sprites.push(s);}\n  G3.hero={r,st,sprites,tea:null,key:null,slot:null,name:null,p:0,running:false,done:false,raf:0,last:0,w:0,rot:-.42,tint:new THREE.Color()};\n  r.domElement.className='hero3d';r.domElement.setAttribute('aria-hidden','true');\n  document.addEventListener('visibilitychange',()=>{if(document.hidden)heroPause();else if(G3.hero.slot)heroPlay();});\n}\nfunction heroMount(name,t){\n  const key=t?artId(t):null,slot=document.querySelector(HERO_SLOTS[name]);\n  if(!slot) return;\n  if(!G3.ok){ slot.innerHTML=key?thumb(t,'herofallback'):''; G3.hero&&(G3.hero.slot=null); return; }\n  if(!G3.hero) heroInit();\n  const H=G3.hero;\n  if(H.key!==(key||'welcome')){\n    if(H.tea){H.st.scene.remove(H.tea.group);disposeTea(H.tea);}\n    const k=key||'welcome';H.tea=key?buildTea(key):buildTea('welcome');H.key=k;\n    H.st.scene.add(H.tea.group);frameStage(H.st,H.tea.cy+.55,9.9);H.tint.set(H.tea.liq).convertSRGBToLinear().multiplyScalar(.72);\n    H.p=0;H.rot=-.42;\n  }\n  if(H.r.domElement.parentNode!==slot) slot.appendChild(H.r.domElement);\n  H.slot=slot;H.name=name;H.w=0;heroPlay();\n}\nfunction heroState(name,p,running,done){\n  const H=G3.hero;if(!H||H.name!==name)return;\n  H.p=p;H.running=running;H.done=done;\n}\nfunction heroStop(){const H=G3.hero;if(!H)return;heroPause();H.slot=null;H.name=null;if(H.r.domElement.parentNode)H.r.domElement.parentNode.removeChild(H.r.domElement);}\nfunction heroPause(){const H=G3.hero;if(H&&H.raf){cancelAnimationFrame(H.raf);H.raf=0;}}\nfunction heroPlay(){const H=G3.hero;if(!H||H.raf||!H.slot)return;H.last=performance.now();H.raf=requestAnimationFrame(heroFrame);}\nfunction heroFrame(now){\n  const H=G3.hero;if(!H||!H.slot){return;}\n  H.raf=requestAnimationFrame(heroFrame);\n  const dt=Math.min(.05,(now-H.last)/1000);H.last=now;\n  const w=H.slot.clientWidth;\n  if(w&&w!==H.w){H.w=w;H.r.setSize(w,w,false);}\n  if(!H.w)return;\n  const t=H.tea;\n  H.rot+=dt*(H.running?.32:.18);t.group.rotation.y=H.rot;\n  t.group.position.y=Math.sin(now/1400)*.03;\n  /* the tea slowly blooms from clear water into its own colour as the brew goes */\n  t.liquid.material.color.lerpColors(WATER_LIN,H.tint,Math.min(1,Math.max(0,H.name==='empty'?1:H.p)));\n  const up=H.running||H.name==='empty'||H.done;\n  H.sprites.forEach((s,i)=>{\n    const u=s.userData;u.t+=dt*u.sp*.55;if(u.t>1)u.t-=1;\n    const k=u.t;s.visible=up;\n    if(up){const gy=t.group.position.y;s.position.set(t.steam.x+u.x*.6+Math.sin(k*5+i)*.12,t.steam.y+gy+k*1.05,t.steam.z+Math.cos(k*4+i)*.08);\n      const sc=.3+k*.6;s.scale.set(sc,sc,1);s.material.opacity=Math.pow(Math.sin(k*Math.PI),1.4)*(H.running||H.done?.26:.15);}\n  });\n  H.r.render(H.st.scene,H.st.cam);\n}\n\n\n/* ================= Storage ================= */\nfunction load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}\nfunction save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}\n\nlet unit = load(\"lt-unit\",\"C\");\nlet favs = new Set(load(\"lt-favs\",[]));\nlet customs = (load(\"lt-customs\",[])||[]).map(sanitize).filter(Boolean);\nlet cat=\"all\", query=\"\", mainTab=\"teas\";\nconst Store={col:null,synced:false};\n\nfunction sanitize(v,idOverride){\n  if(!v||typeof v!==\"object\") return null;\n  const id=String(idOverride||v.id||\"\"); if(!/^tea_[a-z0-9]+$/i.test(id)) return null;\n  const c=TYPES.includes(v.cat)?v.cat:\"green\";\n  const name=String(v.name||\"\").trim().slice(0,40); if(!name) return null;\n  let temp=Number(v.temp); if(!isFinite(temp)) temp=CAT_DEFAULT[c].t; temp=Math.min(100,Math.max(40,Math.round(temp)));\n  let steeps=Array.isArray(v.steeps)?v.steeps.map(Number).filter(n=>isFinite(n)&&n>0&&n<=1800).slice(0,8):[];\n  if(!steeps.length) steeps=[CAT_DEFAULT[c].s];\n  return {id,custom:true,name,cat:c,temp,steeps,\n    leaf:String(v.leaf||\"\").slice(0,60),notes:String(v.notes||\"\").slice(0,600),created:Number(v.created)||0,\n    native:\"Your tea\",origin:\"Your collection\",caffeine:CAT_CAFF[c],liquor:CAT_LIQ[c]};\n}\nconst plain=t=>({id:t.id,name:t.name,cat:t.cat,temp:t.temp,steeps:t.steeps,leaf:t.leaf,notes:t.notes,created:t.created});\nfunction persistLocal(){ save(\"lt-customs\",customs.map(plain)); save(\"lt-favs\",[...favs]); }\nfunction dbWrite(id,obj){ if(!Store.col) return; Store.col.doc(id).set(obj).catch(e=>{ if(e&&e.code===\"invalid_argument\") Store.col=null; }); }\nfunction dbDelete(id){ if(!Store.col) return; Store.col.doc(id).delete().catch(()=>{}); }\nfunction saveFavs(){ persistLocal(); dbWrite(\"prefs\",{favs:[...favs]}); }\n\nasync function initStore(){\n  try{\n    if(!window.claude||typeof window.claude.use!==\"function\") return;\n    const [db,user]=await Promise.all([window.claude.use(\"db\"),window.claude.use(\"user\")]);\n    if(!db||!user) return;\n    const uid=await user.id(); if(!uid) return;\n    const col=db.collection(\"data/users/\"+uid);\n    Store.col=col;\n    col.onSnapshot(snap=>{\n      let list=[],prefs=null;\n      snap.docs.forEach(d=>{ if(!d.exists) return; const v=d.data();\n        if(d.id===\"prefs\") prefs=v; else if(d.id.startsWith(\"tea_\")){ const c=sanitize(v,d.id); if(c) list.push(c); } });\n      if(!Store.synced){\n        Store.synced=true;\n        const ids=new Set(list.map(x=>x.id));\n        customs.filter(c=>!ids.has(c.id)).forEach(c=>{ dbWrite(c.id,plain(c)); list.push(c); });\n        if(!prefs && favs.size) dbWrite(\"prefs\",{favs:[...favs]});\n        $(\"#savedNote\").textContent=\"Your teas are saved to your account, so they show up on your phone and computer.\";\n      }\n      customs=list.sort((a,b)=>(b.created||0)-(a.created||0));\n      if(prefs&&Array.isArray(prefs.favs)) favs=new Set(prefs.favs.filter(x=>typeof x===\"string\"));\n      persistLocal(); renderGrid();\n      if(view&&view.custom){ const fresh=getTea(view.id); if(fresh){view=fresh; renderSheetStatic(); updateUI();} else closeSheet(); }\n    },()=>{ Store.col=null; });\n  }catch(e){ Store.col=null; }\n}\n\n/* ================= Helpers ================= */\nconst $ = s=>document.querySelector(s);\nconst fmt = s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+\":\"+String(s%60).padStart(2,\"0\")};\nconst toF = c=>Math.round(c*9/5+32);\nconst tempText = t=> t.tempLabel ? t.tempLabel : t.tempRange ? (unit===\"C\" ? t.tempRange[0]+\"–\"+t.tempRange[1]+\"°C\" : toF(t.tempRange[0])+\"–\"+toF(t.tempRange[1])+\"°F\") : (unit===\"C\" ? t.temp+\"°C\" : toF(t.temp)+\"°F\");\nconst ordinal = n=>[\"1st\",\"2nd\",\"3rd\",\"4th\",\"5th\",\"6th\",\"7th\",\"8th\"][n]||(n+1)+\"th\";\nconst esc = s=>String(s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst artId = t=> t.custom ? \"type-\"+t.cat : t.id;\nconst getTea = id=> customs.find(c=>c.id===id) || byId[id] || null;\nconst allTeas = ()=>[...customs,...TEAS];\n\ndocument.querySelectorAll(\"[data-unit]\").forEach(b=>{\n  b.setAttribute(\"aria-pressed\", b.dataset.unit===unit);\n  b.addEventListener(\"click\",()=>{unit=b.dataset.unit;save(\"lt-unit\",unit);\n    document.querySelectorAll(\"[data-unit]\").forEach(x=>x.setAttribute(\"aria-pressed\",x.dataset.unit===unit));\n    renderGrid(); if(view) renderSheetStatic(); if(mainTab===\"timer\") renderHub();});\n});\n\n/* ================= Grid ================= */\nconst chipsEl=$(\"#chips\");\nchipsEl.innerHTML=CATS.map(c=>`<button type=\"button\" class=\"chip\" data-cat=\"${c.id}\" aria-pressed=\"${c.id===cat}\">${c.label}<\/button>`).join(\"\");\nchipsEl.addEventListener(\"click\",e=>{const b=e.target.closest(\".chip\");if(!b)return;cat=b.dataset.cat;\n  chipsEl.querySelectorAll(\".chip\").forEach(x=>x.setAttribute(\"aria-pressed\",x===b));renderGrid();});\n$(\"#q\").addEventListener(\"input\",e=>{query=e.target.value.trim().toLowerCase();renderGrid();});\n\nfunction matches(t){\n  if(mainTab===\"saved\" && !favs.has(t.id)) return false;\n  if(mainTab===\"mine\" && !t.custom) return false;\n  if(mainTab===\"teas\" && TYPES.includes(cat) && t.cat!==cat) return false;\n  if(mainTab!==\"teas\" || !query) return true;\n  return [t.name,t.native,t.origin,t.flavor||\"\",t.notes||\"\",CAT_LABEL[t.cat]].join(\" \").toLowerCase().includes(query);\n}\nfunction cardHTML(t){\n  return `<div class=\"card\">\n    <button type=\"button\" class=\"card-main\" data-open=\"${t.id}\" aria-label=\"Open ${esc(t.name)}\">\n      ${thumb(t)}\n      <h3>${esc(t.name)}<\/h3>\n      <span class=\"native\">${esc(t.native)}<\/span>\n      <span class=\"origin\"><span class=\"liquor\" style=\"--liq:${t.liquor}\"><\/span> ${esc(t.custom?CAT_LABEL[t.cat]:t.origin)}<\/span>\n      <span class=\"pills\">\n        <span class=\"pill\"><svg aria-hidden=\"true\"><use href=\"#i-temp\"/><\/svg>${tempText(t)}<\/span>\n        <span class=\"pill\"><svg aria-hidden=\"true\"><use href=\"#i-time\"/><\/svg>${fmt(t.steeps[0])}<\/span>\n      <\/span>\n    <\/button>\n    <button type=\"button\" class=\"fav\" data-fav=\"${t.id}\" aria-pressed=\"${favs.has(t.id)}\" aria-label=\"Save ${esc(t.name)}\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z\"/><\/svg><\/button>\n  <\/div>`;\n}\nconst addCardHTML=`<div class=\"card add\"><button type=\"button\" class=\"card-main\" data-add=\"1\">\n  <span class=\"plus\" aria-hidden=\"true\"><svg viewBox=\"0 0 16 16\"><use href=\"#i-plus\"/><\/svg><\/span>\n  <h3>Add your own tea<\/h3><p>Save a tea you love with its own temperature and steep times.<\/p><\/button><\/div>`;\n\nfunction emptyHTML(ico,title,text,browse){\n  return `<div class=\"empty\"><svg class=\"eico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#i-tab-${ico}\"/><\/svg><h3>${title}<\/h3><p>${text}<\/p>${browse?`<button type=\"button\" class=\"addbtn\" data-go=\"teas\">Browse teas<\/button>`:\"\"}<\/div>`;\n}\nfunction renderGrid(){\n  const list=allTeas().filter(matches);\n  $(\"#count\").textContent = list.length===1 ? \"1 tea\" : list.length+\" teas\";\n  const showAdd = mainTab===\"teas\" && !query;\n  if(mainTab===\"timer\"){ $(\"#grid\").hidden=true; return; }\n  $(\"#grid\").hidden=false;\n  if(!list.length){\n    let msg;\n    if(mainTab===\"saved\") msg=emptyHTML(\"heart\",\"No saved teas yet\",\"Tap the heart on any tea to keep it here.\",true);\n    else if(mainTab===\"mine\") msg=emptyHTML(\"pot\",\"No teas of your own yet\",\"Add a tea you love, with its own water temperature and steep times.\",false);\n    else msg=`<p class=\"empty\">No teas match that search. Try a type like oolong, or a flavor like honey.<\/p>`;\n    $(\"#grid\").innerHTML = msg + (showAdd?addCardHTML:\"\");\n    return;\n  }\n  $(\"#grid\").innerHTML=list.map(cardHTML).join(\"\")+(showAdd?addCardHTML:\"\");\n}\n$(\"#grid\").addEventListener(\"click\",e=>{\n  const f=e.target.closest(\"[data-fav]\");\n  if(f){const id=f.dataset.fav; favs.has(id)?favs.delete(id):favs.add(id); saveFavs();\n    f.setAttribute(\"aria-pressed\",favs.has(id)); if(mainTab===\"saved\") renderGrid(); return;}\n  const go=e.target.closest(\"[data-go]\"); if(go){ switchTab(go.dataset.go); return; }\n  if(e.target.closest(\"[data-add]\")){ openForm(null,e.target.closest(\"[data-add]\")); return; }\n  const o=e.target.closest(\"[data-open]\"); if(o) openSheet(o.dataset.open,o);\n});\n$(\"#addBtn\").addEventListener(\"click\",e=>openForm(null,e.currentTarget));\n\n/* ================= Timer ================= */\nconst C = 2*Math.PI*124, MC = 2*Math.PI*16;\n$(\"#ring\").setAttribute(\"stroke-dasharray\",C);\n/* The Timer tab gets its own copy of the timer card (ids prefixed with h-) */\nconst hubTimer=$(\"#timer\").cloneNode(true);\nhubTimer.querySelectorAll(\"[id]\").forEach(e=>{e.id=\"h-\"+e.id;});\nhubTimer.id=\"h-timer\"; hubTimer.querySelector(\".steeps\").innerHTML=\"\";\n$(\"#hubActive\").insertBefore(hubTimer,$(\"#hubChange\"));\nhubTimer.querySelector(\".btns\").after($(\"#hubChange\"));\nconst T = {tea:null, idx:0, dur:0, rem:0, running:false, done:false, endAt:0, raf:0, to:0};\nlet view=null, viewIdx=0, lastFocus=null, tab=\"brew\";\nconst isMine=()=>!!(T.tea&&view&&T.tea.id===view.id);\nfunction activeTimer(){return !!T.tea && (T.running || T.done || T.rem < T.dur);}\n\nfunction adopt(tea, idx){ stopClock(); T.tea=tea; T.idx=idx; T.dur=tea.steeps[idx]; T.rem=T.dur; T.done=false; T.running=false; }\nfunction start(){\n  if(T.rem<=0){T.rem=T.dur;T.done=false;}\n  ensureAudio();\n  T.running=true; T.done=false; requestWake(); noteRecent(T.tea.id);\n  T.endAt=performance.now()+T.rem*1000;\n  clearTimeout(T.to); T.to=setTimeout(()=>{ if(T.running){T.rem=0; complete();} }, T.rem*1000+40);\n  tick();\n}\nfunction tick(){\n  if(!T.running) return;\n  T.rem=(T.endAt-performance.now())/1000;\n  if(T.rem<=0){T.rem=0; complete(); return;}\n  updateUI();\n  T.raf=requestAnimationFrame(tick);\n}\nfunction stopClock(){cancelAnimationFrame(T.raf); clearTimeout(T.to);}\nfunction pause(){ if(!T.running) return; T.rem=Math.max(0,(T.endAt-performance.now())/1000); T.running=false; stopClock(); releaseWake(); updateUI(); }\nfunction reset(){ stopClock(); releaseWake(); T.running=false; T.done=false; T.rem=T.dur; updateUI(); }\nfunction complete(){\n  if(T.done) return;\n  stopClock(); T.running=false; T.done=true; T.rem=0;\n  releaseWake(); chime(); petals();\n  if(navigator.vibrate) try{navigator.vibrate([120,80,120])}catch(e){}\n  flashTitle(`Your ${T.tea.name} is ready`);\n  updateUI();\n}\n\nfunction updateUI(){\n  updateMini();\n  if(mainTab===\"timer\") paintHub();\n  if(!view) return;\n  const mine=isMine();\n  const dur = mine ? T.dur : view.steeps[viewIdx];\n  const rem = mine ? T.rem : dur;\n  const running = mine && T.running, done = mine && T.done;\n  const idx = mine ? T.idx : viewIdx;\n  const p = dur ? Math.min(1,Math.max(0,1-rem/dur)) : 0;\n\n  $(\"#ring\").setAttribute(\"stroke-dashoffset\", C*(1-p));\n  const a=(-90+360*p)*Math.PI/180;\n  $(\"#bead\").setAttribute(\"cx\",150+124*Math.cos(a)); $(\"#bead\").setAttribute(\"cy\",150+124*Math.sin(a));\n  $(\"#digits\").textContent = fmt(rem);\n  heroState(\"sheet\",p,running,done);\n  $(\"#dial\").classList.toggle(\"is-running\",running);\n  $(\"#timer\").classList.toggle(\"is-done\",done);\n\n  const total=view.steeps.length, hasNext=idx+1<total;\n  const verbing = view.action===\"Whisk\" ? \"Whisking\" : view.action===\"Simmer\" ? \"Simmering\" : \"Steeping\";\n  let status;\n  if(done) status = `Your ${view.name} is ready — pour and enjoy`;\n  else if(running) status = total>1 ? `${verbing}, ${ordinal(idx)} of ${total} steeps…` : `${verbing}…`;\n  else if(rem<dur) status = \"Paused\";\n  else status = total>1 ? `${ordinal(idx)} of ${total} steeps` : \"Ready when you are\";\n  $(\"#status\").textContent=status;\n\n  const pb=$(\"#primary\");\n  if(done) pb.textContent = hasNext ? `Start ${ordinal(idx+1)} steep` : (view.action===\"Whisk\"?\"Whisk again\":\"Brew again\");\n  else if(running) pb.textContent=\"Pause\";\n  else if(rem<dur) pb.textContent=\"Resume\";\n  else pb.textContent=\"Start\";\n\n  $(\"#steeps\").querySelectorAll(\".steep\").forEach((b,i)=>b.setAttribute(\"aria-pressed\",i===idx));\n  const note=$(\"#note\");\n  if(!mine && activeTimer()){note.hidden=false; note.textContent=`Your ${T.tea.name} timer is still going. Starting this one will stop it.`;}\n  else note.hidden=true;\n\n  $(\"#dockTime\").textContent = done ? \"Ready\" : fmt(rem);\n  $(\"#dockLabel\").textContent = done ? `${view.name} is ready` : running ? verbing+\"…\" : (rem<dur ? \"Paused\" : view.name);\n  $(\"#dockBtn\").textContent = (done && hasNext) ? \"Next steep\" : pb.textContent;\n  $(\"#dockRing\").setAttribute(\"stroke-dashoffset\", MC*(1-p));\n}\nfunction paintHub(){\n  const t=T.tea; if(!t||$(\"#hubActive\").hidden) return;\n  const dur=T.dur, rem=T.rem, running=T.running, done=T.done, idx=T.idx;\n  const p=dur?Math.min(1,Math.max(0,1-rem/dur)):0;\n  $(\"#h-ring\").setAttribute(\"stroke-dashoffset\",C*(1-p));\n  const a=(-90+360*p)*Math.PI/180;\n  $(\"#h-bead\").setAttribute(\"cx\",150+124*Math.cos(a)); $(\"#h-bead\").setAttribute(\"cy\",150+124*Math.sin(a));\n  $(\"#h-digits\").textContent=fmt(rem);\n  heroState(\"hub\",p,running,done);\n  $(\"#h-dial\").classList.toggle(\"is-running\",running);\n  $(\"#h-timer\").classList.toggle(\"is-done\",done);\n  const total=t.steeps.length, hasNext=idx+1<total;\n  const verbing=t.action===\"Whisk\"?\"Whisking\":t.action===\"Simmer\"?\"Simmering\":\"Steeping\";\n  let status;\n  if(done) status=`Your ${t.name} is ready — pour and enjoy`;\n  else if(running) status= total>1?`${verbing}, ${ordinal(idx)} of ${total} steeps…`:`${verbing}…`;\n  else if(rem<dur) status=\"Paused\";\n  else status= total>1?`${ordinal(idx)} of ${total} steeps`:\"Ready when you are\";\n  $(\"#h-status\").textContent=status;\n  $(\"#h-primary\").textContent = done ? (hasNext?`Start ${ordinal(idx+1)} steep`:(t.action===\"Whisk\"?\"Whisk again\":\"Brew again\")) : running?\"Pause\":rem<dur?\"Resume\":\"Start\";\n  $(\"#h-steeps\").querySelectorAll(\".steep\").forEach((b,i)=>b.setAttribute(\"aria-pressed\",i===idx));\n  $(\"#hubChange\").hidden = running; $(\"#hubBack\").hidden = running;\n  $(\"#hubBack\").textContent = (rem<dur && !done) ? \"‹ Stop and go back\" : \"‹ Timer home\";\n  $(\"#hubChange\").textContent = (rem<dur && !done) ? \"Stop and choose another tea\" : \"Choose a different tea\";\n}\nfunction updateMini(){\n  const m=$(\"#mini\");\n  updateTabBadge();\n  const show = activeTimer() && !isMine() && mainTab!==\"timer\";\n  m.classList.toggle(\"show\",show); m.tabIndex = show?0:-1;\n  if(!T.tea) return;\n  $(\"#miniName\").textContent=T.tea.name;\n  $(\"#miniTime\").textContent = T.done ? \"Ready\" : fmt(T.rem);\n  m.classList.toggle(\"ready\",T.done);\n  $(\"#miniRing\").setAttribute(\"stroke-dashoffset\", MC*(1-(T.dur?1-T.rem/T.dur:0)));\n}\n$(\"#mini\").addEventListener(\"click\",()=>{ if(T.tea) switchTab(\"timer\"); });\n\n$(\"#primary\").addEventListener(\"click\",()=>{\n  if(!isMine()){ adopt(view,viewIdx); start(); return; }\n  if(T.done){ adopt(view, T.idx+1<view.steeps.length ? T.idx+1 : 0); start(); return; }\n  T.running ? pause() : start();\n});\n$(\"#reset\").addEventListener(\"click\",()=>{ if(isMine()) reset(); else {viewIdx=0; updateUI();} });\n$(\"#steeps\").addEventListener(\"click\",e=>{\n  const b=e.target.closest(\".steep\"); if(!b) return; const i=+b.dataset.i;\n  if(isMine()) adopt(view,i); else viewIdx=i;\n  updateUI();\n});\n$(\"#dockBtn\").addEventListener(\"click\",()=>$(\"#primary\").click());\n\n/* ================= Tabs and the timer page ================= */\nconst TABS=[\"teas\",\"timer\",\"saved\",\"mine\"];\nconst POPULAR=[\"sencha\",\"earl-grey\",\"chamomile\",\"tieguanyin\",\"matcha\",\"english-breakfast\"];\nconst PAGES={timer:[\"Timer\",\"Your cup, steeped just right.\"],saved:[\"Saved teas\",\"Your favorites, one tap away.\"],mine:[\"My teas\",\"Teas you’ve added, with your own timings.\"]};\nlet recent=load(\"lt-recent\",[]); if(!Array.isArray(recent)) recent=[];\nfunction noteRecent(id){ recent=[id,...recent.filter(x=>x!==id)].slice(0,8); save(\"lt-recent\",recent); }\nfunction quickList(){\n  const ids=[]; [...recent,...favs,...POPULAR].forEach(id=>{ if(!ids.includes(id)&&getTea(id)) ids.push(id); });\n  return ids.slice(0,6).map(getTea);\n}\nfunction renderHub(){\n  const t=T.tea;\n  $(\"#hubActive\").hidden=!t; $(\"#hubEmpty\").hidden=!!t;\n  if(t){\n    $(\"#hubName\").textContent=t.name;\n    $(\"#hubSub\").textContent=`${tempText(t)} · ${t.custom?CAT_LABEL[t.cat]:t.origin}`;\n    heroMount(\"hub\",t);\n    $(\"#h-steeps\").innerHTML = t.steeps.length>1 ? t.steeps.map((s,i)=>`<button type=\"button\" class=\"steep\" data-i=\"${i}\" aria-pressed=\"false\">${ordinal(i)} ${fmt(s)}<\/button>`).join(\"\") : \"\";\n    paintHub();\n  } else {\n    heroMount(\"empty\",null);\n    $(\"#qbGrid\").innerHTML=quickList().map(q=>`<button type=\"button\" class=\"qb\" data-qb=\"${q.id}\">${thumb(q,\"qthumb\")}<span class=\"qbt\"><b>${esc(q.name)}<\/b><i>${tempText(q)} · ${fmt(q.steeps[0])}<\/i><\/span><\/butt function seg(el,list,cur,on){
  el.innerHTML=list.map(x=>`<button type="button" data-id="${x.id}" aria-pressed="${x.id===cur}">${x.name}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));on(list.find(x=>x.id===b.dataset.id));};

function lum(rgb){const m=rgb.match(/\d+/g);if(!m)return 1;const [r,g,b]=m.map(Number);return (0.299*r+0.587*g+0.114*b)/255;}
function syncStatus(){
  try{
    const d=frame.contentDocument; if(!d||!d.body) return;
    const bg=getComputedStyle(d.body).backgroundColor;
    $("#status").style.background=bg; $("#status").style.color=lum(bg)>0.55?"#1d1d1d":"#f5f5f5";
    $("#screen").style.background=bg;
  }catch(e){}
}
function applyTheme(){
  try{
    const r=frame.contentDocument.documentElement;
    if(theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",theme);
  }catch(e){}
  if(theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",theme);
  setTimeout(syncStatus,60);
}
function layout(){
  const phone=$("#phone"), screen=$("#screen");
  const full=dev.id==="full"; document.body.classList.toggle("full",full); if(full){ phone.style.cssText=""; screen.style.cssText=""; frame.style.cssText=""; return; }
  screen.style.width=dev.w+"px"; screen.style.height=dev.h+"px";
  frame.style.height=(dev.h-47-24)+"px";
  const pw=dev.w+24, ph=dev.h+24;
  phone.style.width=pw+"px"; phone.style.marginLeft=(-pw/2)+"px";
  const stage=document.querySelector(".stage").getBoundingClientRect();
  const availH=stage.height-14, availW=window.innerWidth-16;
  const s=Math.min(1,availH/ph,availW/pw);

  const h=$("#holder"); h.style.width=(pw*s)+"px"; h.style.height=(ph*s)+"px";
